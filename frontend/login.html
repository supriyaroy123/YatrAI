<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <script>
        (function() {
            let savedTheme = localStorage.getItem('yatrai-theme');
            let migrated = localStorage.getItem('theme-migrated-v2');
            if (!migrated) {
                savedTheme = 'light';
                localStorage.setItem('yatrai-theme', 'light');
                localStorage.setItem('theme-migrated-v2', 'true');
            }
            if (!savedTheme) savedTheme = 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to YatrAI | Smart Traffic Intelligence</title>
    <meta name="description"
        content="Access YatrAI to predict traffic congestion, route travel time, safety risk, and carbon emissions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/frontend/style.css?v=2.0">
    <style>
        .app-container {
            max-width: 440px !important;
            border-radius: var(--radius-xl) !important;
            border: 1px solid var(--border-glass) !important;
            box-shadow: var(--card-shadow) !important;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .auth-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 4px;
            border: 1px solid var(--border-glass);
            margin-bottom: 8px;
        }

        .auth-tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px 0;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .auth-tab-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--card-shadow);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }

        .auth-btn {
            background: var(--accent-blue);
            border: none;
            border-radius: var(--radius-md);
            padding: 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .auth-btn:hover {
            background: var(--accent-blue-hover);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 1;
        }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }

        .input-icon-right {
            position: absolute;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 2;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .input-icon-right:hover {
            opacity: 1;
        }

        .input-wrapper input {
            padding-left: 42px;
            padding-right: 42px;
        }

        .alert-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--color-red);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 0.8rem;
            line-height: 1.4;
            display: none;
        }

        /* Background Image Styles */
        .image-bg {
            display: none;
        }

        /* Animated Orbs Overlay */
        .orbs-bg {
            display: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(216, 180, 254, 0.8), rgba(147, 197, 253, 0.5) 60%, transparent 80%);
            box-shadow: inset -10px -10px 20px rgba(139, 92, 246, 0.15), inset 10px 10px 20px rgba(255, 255, 255, 0.9);
            animation: float-orb infinite ease-in-out alternate;
        }

        @keyframes float-orb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, -40px) scale(1.05); }
        }

        /* Orb 1: Large, top left */
        .orb:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 15%; opacity: 0.8; animation-duration: 12s; animation-delay: 0s; }
        /* Orb 2: Medium, bottom left */
        .orb:nth-child(2) { width: 80px; height: 80px; bottom: 15%; left: 10%; opacity: 0.7; animation-duration: 15s; animation-delay: -3s; }
        /* Orb 3: Small, far back top center */
        .orb:nth-child(3) { width: 40px; height: 40px; top: 15%; left: 50%; opacity: 0.5; filter: blur(2px); animation-duration: 9s; animation-delay: -5s; }
        /* Orb 4: Medium-large, top right */
        .orb:nth-child(4) { width: 100px; height: 100px; top: 20%; right: 15%; opacity: 0.85; animation-duration: 18s; animation-delay: -2s; }
        /* Orb 5: Small, far back mid right */
        .orb:nth-child(5) { width: 50px; height: 50px; top: 45%; right: 10%; opacity: 0.6; filter: blur(1.5px); animation-duration: 14s; animation-delay: -7s; }
        /* Orb 6: Large, bottom right */
        .orb:nth-child(6) { width: 110px; height: 110px; bottom: 10%; right: 20%; opacity: 0.75; animation-duration: 20s; animation-delay: -10s; }
        /* Orb 7: Small, bottom center */
        .orb:nth-child(7) { width: 35px; height: 35px; bottom: 10%; left: 45%; opacity: 0.5; filter: blur(1px); animation-duration: 11s; animation-delay: -1s; }
        /* Orb 8: Medium, mid left */
        .orb:nth-child(8) { width: 70px; height: 70px; top: 50%; left: 5%; opacity: 0.65; animation-duration: 16s; animation-delay: -8s; }

        @media (max-width: 480px) {
            .orb:nth-child(1) { width: 80px; height: 80px; top: 5%; left: 5%; }
            .orb:nth-child(2) { width: 60px; height: 60px; bottom: 10%; left: 5%; }
            .orb:nth-child(4) { width: 70px; height: 70px; top: 15%; right: 5%; }
            .orb:nth-child(6) { width: 75px; height: 75px; bottom: 15%; right: 5%; }
            .orb:nth-child(5), .orb:nth-child(7), .orb:nth-child(8) { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb { animation: none; }
        }
    </style>
</head>

<body>
    <!-- Background Image -->
    <div class="image-bg"></div>

    <!-- Animated Orbs Overlay -->
    <div class="orbs-bg">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Error Toast -->
    <div id="error-toast" class="error-toast hidden">
        <span id="error-toast-icon">⚠️</span>
        <span id="error-toast-msg"></span>
        <button id="error-toast-close" onclick="hideToast()">&times;</button>
    </div>

    <!-- App Device Shell Container -->
    <div class="app-container" style="min-height: auto; margin: 24px auto;">
        <div class="screen-content" style="padding: 24px 20px;">
            <div class="auth-card">
                <!-- Header -->
                <div class="auth-header">
                    <div class="auth-logo">
                        <svg width="44" height="44" viewBox="0 0 40 40" fill="none">
                            <circle cx="20" cy="20" r="18" stroke="url(#grad)" stroke-width="3" fill="none" />
                            <path d="M14 26L20 12L26 26" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <circle cx="20" cy="20" r="3" fill="url(#grad)" />
                            <defs>
                                <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40">
                                    <stop stop-color="#3b82f6" />
                                    <stop offset="0.5" stop-color="#8b5cf6" />
                                    <stop offset="1" stop-color="#ec4899" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1 class="auth-title">Welcome to YatrAI</h1>
                    <p class="auth-subtitle">Real-time traffic & trip intelligence for Indian roads</p>
                </div>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <button id="tab-login" class="auth-tab-btn active" onclick="switchTab('login')">Sign In</button>
                    <button id="tab-register" class="auth-tab-btn" onclick="switchTab('register')">Sign Up</button>
                </div>

                <!-- Local Alert Box -->
                <div id="auth-alert" class="alert-box"></div>

                <!-- Login Form -->
                <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon-left">✉️</span>
                            <input type="email" id="login-email" placeholder="e.g. name@gmail.com" required
                                autocomplete="email">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon-left">🔒</span>
                            <input type="password" id="login-password" placeholder="Enter password" required
                                autocomplete="current-password">
                            <span class="input-icon-right toggle-password"
                                onclick="togglePasswordVisibility(this, 'login-password')"
                                title="Show Password">👁️</span>
                        </div>
                    </div>
                    <button type="submit" id="btn-login-submit" class="auth-btn">
                        <span>Sign In</span>
                    </button>
                </form>

                <!-- Register Form -->
                <form id="form-register" class="auth-form hidden" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="register-name">Full Name</label>
                        <div class="input-wrapper">
                            <span class="input-icon-left">👤</span>
                            <input type="text" id="register-name" placeholder="e.g. Supriya Roy" required
                                autocomplete="name">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="register-email">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon-left">✉️</span>
                            <input type="email" id="register-email" placeholder="e.g. Roy@gmail.com" required
                                autocomplete="email">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="register-password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon-left">🔒</span>
                            <input type="password" id="register-password" placeholder="Create password (min 6 chars)"
                                required minlength="6" autocomplete="new-password">
                            <span class="input-icon-right toggle-password"
                                onclick="togglePasswordVisibility(this, 'register-password')"
                                title="Show Password">👁️</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="register-confirm">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon-left">🔑</span>
                            <input type="password" id="register-confirm" placeholder="Confirm your password" required
                                autocomplete="new-password">
                            <span class="input-icon-right toggle-password"
                                onclick="togglePasswordVisibility(this, 'register-confirm')"
                                title="Show Password">👁️</span>
                        </div>
                    </div>
                    <button type="submit" id="btn-register-submit" class="auth-btn">
                        <span>Create Account</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Load Firebase Configuration & Init -->
    <script type="module" src="/frontend/firebase-config.js"></script>
    <script type="module">
        const checkAuth = setInterval(async () => {
            if (window.initFirebaseConfig && !window.firebaseAuth) {
                await window.initFirebaseConfig();
            }
            if (window.firebaseOps && window.firebaseAuth) {
                clearInterval(checkAuth);
                const { onAuthStateChanged } = window.firebaseOps;
                onAuthStateChanged(window.firebaseAuth, (user) => {
                    if (user) {
                        window.location.href = '/';
                    }
                });
            }
        }, 100);
    </script>

    <script>
        // Global tab state
        let activeTab = 'login';

        function switchTab(tab) {
            activeTab = tab;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const alertBox = document.getElementById('auth-alert');

            alertBox.style.display = 'none';

            if (tab === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
            }
        }

        function showAlert(message) {
            const alertBox = document.getElementById('auth-alert');
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        function togglePasswordVisibility(icon, inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
                icon.title = 'Hide Password';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
                icon.title = 'Show Password';
            }
        }

        // Firebase login/register wrapper
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('btn-login-submit');
            const alertBox = document.getElementById('auth-alert');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = 'Signing In...';

            try {
                if (!window.firebaseOps) {
                    throw new Error("Firebase SDK is loading, please try again in a moment.");
                }
                const { signInWithEmailAndPassword } = window.firebaseOps;
                await signInWithEmailAndPassword(window.firebaseAuth, email, password);

                // Successful login redirects back to index page
                window.location.href = '/';
            } catch (err) {
                console.error("Login error:", err);
                let friendlyMsg = err.message;
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    friendlyMsg = "Invalid email or password. Please try again.";
                } else if (err.code === 'auth/invalid-email') {
                    friendlyMsg = "Invalid email format.";
                }
                showAlert(friendlyMsg);
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = 'Sign In';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm').value;
            const submitBtn = document.getElementById('btn-register-submit');
            const alertBox = document.getElementById('auth-alert');

            alertBox.style.display = 'none';

            if (password !== confirmPassword) {
                showAlert("Passwords do not match.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = 'Creating Account...';

            try {
                if (!window.firebaseOps) {
                    throw new Error("Firebase SDK is loading, please try again in a moment.");
                }
                const { createUserWithEmailAndPassword, updateProfile, doc, setDoc, serverTimestamp } = window.firebaseOps;

                // Create user
                const userCredential = await createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                const user = userCredential.user;

                // Update auth profile display name
                await updateProfile(user, { displayName: name });

                // Create profile in Firestore /users/{uid}
                await setDoc(doc(window.firebaseDb, "users", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: email,
                    createdAt: serverTimestamp()
                });

                // Success redirects to index
                window.location.href = '/';
            } catch (err) {
                console.error("Registration error:", err);
                let friendlyMsg = err.message;
                if (err.code === 'auth/email-already-in-use') {
                    friendlyMsg = "An account already exists with this email address.";
                } else if (err.code === 'auth/weak-password') {
                    friendlyMsg = "The password is too weak. Please use at least 6 characters.";
                }
                showAlert(friendlyMsg);
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent = 'Create Account';
            }
        }

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const checkInterval = setInterval(() => {
                if (window.firebaseOps && window.firebaseAuth) {
                    clearInterval(checkInterval);
                    const { onAuthStateChanged } = window.firebaseOps;
                    onAuthStateChanged(window.firebaseAuth, (user) => {
                        if (user) {
                            // User is already logged in, redirect to home page
                            window.location.href = '/';
                        }
                    });
                }
            }, 100);
        });

        // Toast placeholders for styling match
        function hideToast() {
            document.getElementById('error-toast').classList.add('hidden');
        }
    </script>
</body>

</html>
